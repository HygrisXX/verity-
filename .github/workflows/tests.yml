name: Testy CI (Unit + E2E)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verity-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod portalu VERITY
        uses: actions/checkout@v7

      - name: Ustaw środowisko Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Ustaw środowisko Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Sprawdź dostępność bezgłowego Chrome/Chromium
        run: |
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null && ! command -v chromium-browser >/dev/null; then
            sudo apt-get update && (sudo apt-get install -y chromium || sudo apt-get install -y chromium-browser)
          fi
          command -v google-chrome || command -v chromium || command -v chromium-browser

      - name: Uruchom testy jednostkowe i integralności SEO (Python)
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Uruchom testy przeglądarkowe E2E (Headless Chrome/Chromium)
        run: |
          node tests/e2e_browser_test.mjs /tmp/verity_e2e_ci
