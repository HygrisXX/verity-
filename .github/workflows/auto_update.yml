name: Automatyczna Aktualizacja Wiadomości RSS (VERITY)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verity-main-update
  cancel-in-progress: false

jobs:
  fetch-and-synthesize:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod portalu VERITY
        uses: actions/checkout@v7

      - name: Ustaw środowisko Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Zainstaluj zależności graficzne OG (Pillow)
        run: |
          python3 -m pip install --quiet pillow

      - name: Pobierz dane rynkowe i pogodowe (NBP, IMGW, Open-Meteo, giełdy)
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 market_data.py || true

      - name: Pobierz najnowsze wiadomości z polskich kanałów RSS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 update_live_news.py --quality-gate

      - name: Zweryfikuj integralność testami jednostkowymi przed publikacją
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Zapisz zaktualizowane artykuły na stronie (GitHub Pages) i powiadom IndexNow
        run: |
          if [ -f articles.json ]; then
            git config user.name "VerityBot"
            git config user.email "bot@verity.pl"
            git add -A articles.json articles-index.json editorial_state.json market_data.json markets news-sitemap.xml sitemap.xml feed.xml robots.txt index.html 404.html manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png community.js cameras.js cameras.json a7f3c91e4b2d8065e19a4f7c3d28b50e.txt og Polska Swiat Sport moderacja kamery rynki metodologia o-nas polityka-prywatnosci zglos-blad
            if ! git diff --staged --quiet; then
              git commit -m "Automatyczna aktualizacja artykułów RSS"
              git pull --rebase --autostash origin main || { git rebase --abort || true; exit 1; }
              git push origin main
              PYTHONDONTWRITEBYTECODE=1 python3 update_live_news.py --ping-indexnow || true
            fi
          fi
